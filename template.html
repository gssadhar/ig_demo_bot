<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Stock Screener Dashboard</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background-color: #0f172a; color: #f8fafc; }
        h1 { color: #38bdf8; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; background: #1e293b; border-radius: 8px; overflow: hidden; }
        th, td { padding: 12px; border-bottom: 1px solid #334155; text-align: left; }
        th { background-color: #0f172a; color: #94a3b8; text-transform: uppercase; font-size: 0.85rem; }
        .buy-badge { background-color: #0284c7; color: white; padding: 4px 8px; border-radius: 4px; font-weight: bold; font-size: 0.75rem; }
        .strong-buy-badge { background-color: #16a34a; color: white; padding: 4px 8px; border-radius: 4px; font-weight: bold; font-size: 0.75rem; }
    </style>
</head>
<body>
    <h1>Stock Screener Dashboard</h1>
    <p>Generated automatically by your stock screener bot (4x Daily UK & US Feeds).</p>
    <table>
        <thead>
            <tr>
                <th>Ticker (Market)</th>
                <th>Sector</th>
                <th>Price</th>
                <th>Signal</th>
                <th>Stop-Loss</th>
                <th>1.5R Target</th>
            </tr>
        </thead>
        <tbody>
            {{TABLE_ROWS}}
        </tbody>
    </table>
</body>
</html>
