<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Stock Screener Results</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background-color: #f4f4f9; color: #333; }
        h1 { color: #0056b3; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; background: #fff; }
        th, td { padding: 12px; border: 1px solid #ddd; text-align: left; }
        th { background-color: #0056b3; color: white; }
        tr:nth-child(even) { background-color: #f9f9f9; }
    </style>
</head>
<body>
    <h1>Stock Screener Dashboard</h1>
    <p>Generated automatically by your stock screener bot.</p>
    <table>
        <thead>
            <tr>
                <th>Ticker</th>
                <th>Company Name</th>
                <th>Price</th>
                <th>Change</th>
            </tr>
        </thead>
        <tbody>
            <!-- Dynamic rows can be injected here -->
            <tr>
                <td colspan="4" style="text-align: center;">No data loaded yet.</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
