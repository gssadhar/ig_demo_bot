name: Global Equity Screener Alert & IG Execution

on:
  schedule:
    # Runs 4 times a day (UTC times aligning roughly with UK/US open & close windows)
    # 07:30 UTC (UK Open prep), 13:00 UTC (US Open prep), 16:30 UTC (UK Close), 21:30 UTC (US Close)
    - cron: '30 7,13,16,21 * * 1-5'
  workflow_dispatch:

jobs:
  run-screener:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy yfinance trading-ig

      - name: Run Screener & Execute Trades
        env:
          IG_USERNAME: ${{ secrets.IG_USERNAME }}
          IG_PASSWORD: ${{ secrets.IG_PASSWORD }}
          IG_API_KEY: ${{ secrets.IG_API_KEY }}
        run: python stock_screener.py

      - name: Commit & Push Web Dashboard
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html || true
          git diff --staged --quiet || git commit -m "Auto-update 4x daily dashboard & execute orders [skip ci]"
          git push || true
